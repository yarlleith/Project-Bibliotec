<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="listagem.css">
    <link rel="stylesheet" href="../../Styles/global.css">

    <link rel="shortcut icon" href="../../imgs/Icone - Bibliotec.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">



    <title>Listagem de Livros</title>
</head>
<body class="pagina-listagem">
    <aside class="menu-lateral">
        <div class="topo-menu">
            <button class="botao-voltar">
                <i class="fa-solid fa-chevron-left"></i>
            </button>

            <img class="logo" src="../../imgs/logo-vertical.svg" alt="">
        </div>

        <nav class="menu-navegacao">

            <a href="#" class="item-menu">
                <i class="fa-solid fa-user"></i>
                <span>Perfil</span>
            <a href="#" class="item-menu">
                <i class="fa-solid fa-user-plus"></i>
                <span>Cadastrar Usuario</span>
            </a>
            <a href="#" class="item-menu">
                <i class="fa-solid fa-user-group"></i>
                <span>Listar Usuario</span>
            </a>
            <a href="#" class="item-menu">
                <i class="fa-solid fa-book-medical"></i>
                <span>Cadastrar Livro </span>
            </a>
            <a href="#" class="item-menu ativo">
                <i class="fa-solid fa-book-bookmark"></i>
                <span>Listar Livros</span>
            </a>
        </nav>

        <a href="../../Login/login.html" class="botao-sair">
            <i class="fa-solid fa-right-from-bracket"></i>
                <span>Sair</span>

        </a>
    </aside>

    <main class="conteudo-listagem">
        <section class="cabecalho-pagina">
            <h1>Listar Livros</h1>
            <p>Gerencie e acompanhe os livros cadastrados</p>
        </section>
        <section class="card-listagem">
            <div class="area-busca">
                <div class="campo-busca">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" placeholder="Buscar livros por nome...">
                </div>

                <button class="botao-filtro">
                    <i class="fa-solid fa-sliders"></i>
                    <span>Filtros</span>
                </button>
            </div>
            <div class="cabecalho-lista">
                <h2>Nome</h2>
                <h2>Reservado</h2>
                <h2>Categoria</h2>
                <h2>Editar</h2>
                <h2>Detalhe</h2>
            </div>
        </section>
    </main>
</body>
</html>
