<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../Styles/global.css">
    <link rel="stylesheet" href="login.css">
    <link rel="shortcut icon" href="../imgs/Icone - Bibliotec.png" type="image/x-icon">
    <title>Bibliotec - Login</title>
</head>
<body>
        <header class="cabecalho">
        <a href="#">
            <img src="../imgs/Logo Horizontal - branca.svg" alt="Logo do Sistema Bibliotec">
        </a>

        <nav class="navegacao">
            <a href="#quem-somos">Home</a>
         
           
        </nav>
    </header>

    <main class="conteudo">
        <section class="login">
            <div class="login-cabecalho">
                <img src="../imgs/Icone - Bibliotec.png" alt="Login Bibliotec">

                <h1>Bem-vindo(a) a Bibliotec</h1>
            </div>
            
            <form >
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="email@alunosenai.com">
                </div>
                <div class="campo">
                    <label for="senha">Senha</label>
                    <div class="campo-senha">
                        <input type="password" id="senha" placeholder="********">
                        <button type="button" id="mostrar-senha" class="botao-olho">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye-icon lucide-eye"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
 
                        </button>
                    </div>
                </div>
                <button class="botao-entrar" type="submit" >Entrar</button>
                
                <button class="botao-google">
                    <img src="../imgs/icons_google.svg" alt="logo google">
                    <span>continuar com Google</span>
                </button>
            </form>
        </section>
        </main>
        <script src="login.js"></script>
    </body>
    </html>
